plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.4'
    id 'org.graalvm.buildtools.native' version '0.11.4'
}

group = 'com.github.churunfa'
version = '0.0.1-SNAPSHOT'
description = 'switch-auto-web'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

def grpcVersion = '1.78.0'
def protobufVersion = '4.33.4'
def protocVersion = protobufVersion


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Source: https://mvnrepository.com/artifact/net.devh/grpc-client-spring-boot-starter
    implementation("net.devh:grpc-client-spring-boot-starter:3.1.0.RELEASE")


    implementation platform("io.grpc:grpc-bom:${grpcVersion}")
    implementation "io.grpc:grpc-api:${grpcVersion}"
    implementation "io.grpc:grpc-core:${grpcVersion}"

    // gRPC 核心依赖
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"

    // 只有运行时才需要 Netty (传输层)
    runtimeOnly "io.grpc:grpc-netty-shaded:${grpcVersion}"

    // 生成代码所需的注解库 (Java 9+ 必须)
    compileOnly "org.apache.tomcat:annotations-api:6.0.53"

    // Protobuf 自身库
    implementation "com.google.protobuf:protobuf-java-util:${protobufVersion}"

    // Source: https://mvnrepository.com/artifact/com.alibaba.fastjson2/fastjson2
    implementation("com.alibaba.fastjson2:fastjson2:2.0.60")

    // Apache Commons Collections
    implementation 'org.apache.commons:commons-collections4:4.4'
    implementation 'org.boofcv:boofcv-core:1.3.0'
    implementation 'org.boofcv:boofcv-swing:1.3.0' // 用于与 BufferedImage 互相转换
    // Source: https://mvnrepository.com/artifact/com.alibaba.fastjson2/fastjson2-extension-spring6
    implementation("com.alibaba.fastjson2:fastjson2-extension-spring6:2.0.61")
    // 解决 Bouncy Castle 缺失报错
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bctls-jdk18on:1.78.1'
    
    // Spring AI 依赖
    implementation("org.springframework.ai:spring-ai-openai:2.0.0-M2")
    implementation("org.springframework.ai:spring-ai-client-chat:2.0.0-M2")
//    implementation("org.springframework.ai:spring-ai-openai-spring-boot-starter:1.1.2")
//    implementation("org.springframework.ai:spring-ai-core:1.1.2")


    // SQLite 驱动
    implementation 'org.xerial:sqlite-jdbc:3.51.2.0'
    
    // MyBatis-Plus
    implementation 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.16'

    // Source: https://mvnrepository.com/artifact/org.bytedeco/javacv-platform
    implementation("org.bytedeco:javacv-platform:1.5.13")
}

// --- Protobuf 配置 (保持不变，指向你C++项目的proto目录) ---
protobuf {
    protoc { artifact = "com.google.protobuf:protoc:${protocVersion}" }
    plugins {
        grpc { artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}" }
    }
    generateProtoTasks {
        all()*.plugins { grpc {} }
    }
}

graalvmNative {
    binaries {
        main {
            buildArgs.add("--initialize-at-build-time=ch.qos.logback,org.slf4j,com.alibaba.fastjson2")
        }
    }
}
tasks.named('test') {
    useJUnitPlatform()
}
